name: Build NexDesk (Windows x64)

# Produces two artifacts:
#   NexDesk-<version>-x64.msi      the installer (primary)
#   NexDesk-<version>-x86_64.exe   single-file portable exe
#
# The MSI installs under Program Files. The portable exe extracts the payload to
# %LOCALAPPDATA%\nexdesk and runs from there; the home page then offers to
# promote that run into a real installation.
#
# Both are Authenticode-signed when the SIGN_ENABLED repository variable is set.
# Signing happens in two stages because the portable exe embeds a compressed
# copy of the payload: see docs/CODE-SIGNING.md. A build with SIGN_ENABLED unset
# still succeeds, so contributors and forks can build, but it warns loudly and
# must not be published as a release.
#
# Trigger: Actions -> "Build NexDesk (Windows x64)" -> Run workflow,
# or push a tag like v1.5.11.

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: "Attach the artifacts to a GitHub Release"
        type: boolean
        default: false
  # Deliberately not triggered by tag pushes: the release is created by
  # `publish-release.yml` from artifacts that already exist, and a `push: tags`
  # trigger would start a second, pointless rebuild of both platforms.

permissions:
  contents: write
  # The SignPath action reads the artifact uploaded earlier in the same run.
  actions: read

# One build at a time. A Windows run costs ~120 billed minutes (the runner has
# a 2x multiplier), so leaving two queued runs to finish after a second push
# doubles the bill for an artifact nobody will download.
#
# `cancel-in-progress` only cancels runs that have not started yet and are
# superseded by a newer commit on the same ref. A release tag is deliberately
# excluded: cancelling a tagged build would leave a half-published release.
concurrency:
  group: nexdesk-windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # VERSION and ARTIFACT_NAME are derived from Cargo.toml in the first step, so
  # the upstream-sync job can bump the version and have this workflow pick it up
  # without editing YAML.
  # Pinned to the versions upstream 1.5.0 is known to build with. The Flutter
  # engine is patched by RustDesk, so the SDK version cannot be bumped freely.
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_CMAKE_VERSION: "4.3.0"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # Baked into the binary via `option_env!` in src/nexdesk.rs so installed
  # clients poll this repository for updates.
  NEXDESK_UPDATE_REPO: ${{ github.repository }}
  # Self-hosted rendezvous (hbbs) server, baked into the binary via
  # `option_env!` in src/nexdesk_server.rs.
  #
  # Set these as GitHub Actions *variables* (Settings -> Secrets and
  # variables -> Actions -> Variables), not secrets - they are not confidential:
  #   NEXDESK_SERVER      = "rd.your-domain.com"
  #   NEXDESK_SERVER_KEY  = "base64 of data/id_ed25519.pub from the server"
  #
  # When NEXDESK_SERVER is empty the build falls back to upstream's public
  # infrastructure, which is what you do not want for an Iranian audience.
  # Accept the pre-rebrand variable names too: the repository still carries
  # DESKYAR_SERVER / DESKYAR_SERVER_KEY, and an empty value would silently bake
  # in RustDesk's public servers.
  NEXDESK_SERVER: ${{ vars.NEXDESK_SERVER || vars.DESKYAR_SERVER }}
  NEXDESK_SERVER_KEY: ${{ vars.NEXDESK_SERVER_KEY || vars.DESKYAR_SERVER_KEY }}
  # Signed update feed. The manifest lives on our own site; the Ed25519 public
  # key baked into the binary is what makes an update trustworthy. Public keys
  # are not secret, so they belong in Variables, not Secrets.
  #   NEXDESK_UPDATE_PUBKEY = "2026-11:<64 hex chars>"
  NEXDESK_UPDATE_MANIFEST_URL: https://nexdesk.ir/updates/windows.json
  NEXDESK_UPDATE_CHANNEL: stable
  NEXDESK_UPDATE_PUBKEY: ${{ vars.NEXDESK_UPDATE_PUBKEY }}
  # Code signing. Left as a repository *variable* rather than a secret so the
  # value is visible in the run log, and so a fork with no signing project can
  # still build: unset means the artifacts ship unsigned, with a warning.
  #
  # Set in Settings -> Secrets and variables -> Actions -> Variables:
  #   SIGN_ENABLED          = "true"
  #   SIGNPATH_ORG_ID       = the organization GUID from SignPath
  #   SIGNPATH_PROJECT_SLUG = nexdesk
  #   SIGNPATH_POLICY_SLUG  = release-signing
  # plus the SIGNPATH_API_TOKEN secret.
  SIGN_ENABLED: ${{ vars.SIGN_ENABLED }}
  SIGNPATH_ORG_ID: ${{ vars.SIGNPATH_ORG_ID }}
  SIGNPATH_PROJECT_SLUG: nexdesk
  SIGNPATH_POLICY_SLUG: release-signing

jobs:
  # The Dart <-> Rust bridge is generated, not committed, so it has to be
  # produced first and shared with the build job.
  bridge:
    uses: ./.github/workflows/bridge.yml

  windows:
    name: Windows x64
    needs: [bridge]
    runs-on: windows-2022
    # A signing request waits for a human approver, and that wait counts against
    # this budget. 150 minutes covered the build alone; the extra headroom is
    # for two approvals, each of which can sit for tens of minutes.
    timeout-minutes: 240

    steps:
      - name: Export cache environment for vcpkg
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          submodules: recursive

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::could not read the version from Cargo.toml"
            exit 1
          fi
          # Asset name must match `nexdesk::asset_name()` and the URL the
          # updater builds: <product>-<version>-<arch>.exe
          ARTIFACT_NAME="NexDesk-${VERSION}-x86_64.exe"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
          echo "building $ARTIFACT_NAME"

      - name: Check Cargo.lock matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          # `cargo build --locked` refuses to run when Cargo.lock disagrees with
          # the manifests, and it refuses *after* the Flutter engine download and
          # the vcpkg install - roughly forty minutes in, with a message that
          # points at the lock file rather than at the version bump that caused
          # it. Bumping the version in a Cargo.toml without updating Cargo.lock
          # is the usual reason, so check that pair here, in two seconds.
          #
          # Three crates are checked, not just the root: `libs/portable` and
          # `libs/virtual_display/dylib` ship inside the payload and stamp their
          # VERSIONINFO from their own package version, so a bump that missed
          # one of them would publish a payload that disagrees with itself.
          check() {
            local pkg="$1" manifest="$2" want locked
            want=$(grep -m1 '^version' "$manifest" | sed -E 's/.*"(.*)".*/\1/')
            locked=$(grep -A2 "^name = \"$pkg\"\$" Cargo.lock \
                     | grep -m1 '^version = ' \
                     | sed -E 's/.*"(.*)".*/\1/')
            if [ -z "$locked" ]; then
              echo "::error::no [[package]] name = \"$pkg\" entry in Cargo.lock"
              return 1
            fi
            if [ "$want" != "$locked" ]; then
              echo "::error::$manifest says $want but Cargo.lock says $locked for $pkg."
              echo "Fix: run 'python scripts/bump-version.py $want' - it updates"
              echo "every manifest and the matching lock entries together."
              return 1
            fi
            echo "$pkg: $want (in sync)"
          }
          check rustdesk Cargo.toml
          check rustdesk-portable-packer libs/portable/Cargo.toml
          check dylib_virtual_display libs/virtual_display/dylib/Cargo.toml

      - name: Restore generated bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      # The installer is fetched from the llvm-project release CDN, which
      # intermittently answers 504. The action itself retries twice with a
      # short backoff and then gives up, so a second attempt is the only way
      # to ride out a longer blip without failing the whole job.
      - name: Install LLVM / Clang
        id: llvm
        continue-on-error: true
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      # The action downloads the installer from the llvm-project *release*
      # CDN, which is the one endpoint that kept answering 504. The windows
      # runner image already ships LLVM under Program Files, and bindgen only
      # needs libclang, so falling back to it costs nothing and removes the
      # dependency on that CDN entirely.
      - name: Fall back to the runner's LLVM
        if: steps.llvm.outcome == 'failure'
        shell: bash
        run: |
          for root in "/c/Program Files/LLVM" "/c/Program Files (x86)/LLVM"; do
            if [ -f "$root/bin/libclang.dll" ]; then
              echo "LIBCLANG_PATH=$root/bin" >> "$GITHUB_ENV"
              echo "$root/bin" >> "$GITHUB_PATH"
              echo "::warning::using the runner's preinstalled LLVM at $root"
              "$root/bin/clang.exe" --version || true
              exit 0
            fi
          done
          echo "::error::no LLVM available - neither the action nor the runner copy"
          exit 1

      # vcpkg fetches a CMake 4.4 toolchain from the same release CDN. PyPI
      # serves the same binary from a different host, so installing it here
      # means vcpkg finds a suitable `cmake` on PATH and skips its download.
      - name: Install CMake from PyPI
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-input cmake
          cmake --version

      - name: Install Flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # RustDesk ships a patched Flutter engine (text input, multi-window).
      # The stock engine builds but misbehaves at runtime.
      
      - name: Swap in the RustDesk Flutter engine
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          flutter doctor -v
          flutter precache --windows

          # Detect the actual Flutter SDK installation path.
          $flutterCommand = Get-Command flutter -ErrorAction Stop
          $flutterRoot = Split-Path (Split-Path $flutterCommand.Source -Parent) -Parent
          Write-Host "Flutter root: $flutterRoot"

          # Download the custom RustDesk engine.
          $zipPath = Join-Path $PWD "windows-x64-release.zip"
          $extractPath = Join-Path $PWD "windows-x64-release"

          # `github.com/rustdesk/engine/releases/download/...` is unreachable
          # from the runners - it answers 504 or hangs for minutes - while the
          # REST API asset endpoint, and the storage host it redirects to, are
          # both healthy. Same bytes: the API reports 63,301,215 of them, which
          # is exactly what this archive weighs.
          $ghHeaders = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = "application/vnd.github+json"
          }
          $engineRelease = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/rustdesk/engine/releases/tags/main" `
            -Headers $ghHeaders
          $engineAsset = $engineRelease.assets |
            Where-Object { $_.name -eq "windows-x64-release.zip" } |
            Select-Object -First 1
          if (-not $engineAsset) {
            throw "windows-x64-release.zip is missing from the rustdesk/engine 'main' release."
          }
          Write-Host "engine asset $($engineAsset.id), $($engineAsset.size) bytes"

          for ($attempt = 1; $attempt -le 6; $attempt++) {
            try {
              Invoke-WebRequest `
                -Uri "https://api.github.com/repos/rustdesk/engine/releases/assets/$($engineAsset.id)" `
                -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/octet-stream" } `
                -OutFile $zipPath `
                -UseBasicParsing
              if ((Test-Path $zipPath) -and ((Get-Item $zipPath).Length -gt 1MB)) {
                Write-Host "engine downloaded on attempt $attempt"
                break
              }
            } catch {
              Write-Host "::warning::engine download failed (attempt $attempt/6): $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 20
          }

          if (-not (Test-Path $zipPath)) {
            throw "RustDesk engine ZIP was not downloaded."
          }

          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

          # Locate the engine files regardless of the ZIP's folder structure.
          $engineDll = Get-ChildItem `
            -Path $extractPath `
            -Filter "flutter_windows.dll" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $engineDll) {
            Get-ChildItem $extractPath -Recurse |
              Select-Object FullName |
              Format-Table -AutoSize |
              Out-String |
              Write-Host

            throw "flutter_windows.dll was not found in the downloaded RustDesk engine ZIP."
          }

          $sourcePath = $engineDll.Directory.FullName
          $targetPath = Join-Path $flutterRoot "bin\cache\artifacts\engine\windows-x64-release"

          New-Item -ItemType Directory -Path $targetPath -Force | Out-Null

          Write-Host "Engine source: $sourcePath"
          Write-Host "Engine target: $targetPath"

          Copy-Item `
            -Path (Join-Path $sourcePath "*") `
            -Destination $targetPath `
            -Recurse `
            -Force

          if (-not (Test-Path (Join-Path $targetPath "flutter_windows.dll"))) {
            throw "RustDesk Flutter engine installation failed."
          }

          Write-Host "RustDesk Flutter engine installed successfully."

      - name: Patch Flutter dropdown filter
        shell: bash
        run: |
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_ROOT"
          cd "$FLUTTER_ROOT"
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Dart analysis (fast feedback)
        # `flutter build windows` is only reached after the cargo and vcpkg
        # work, so a one-line Dart type error used to surface ~20 minutes into
        # the run and cost a whole build. Analysing the package right after
        # Flutter is installed prints the same diagnostics in about a minute.
        # Non-blocking on purpose: pre-existing diagnostics elsewhere must not
        # stop a release, and the real build below is still the gate.
        continue-on-error: true
        shell: bash
        run: |
          cd flutter
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      # See the Android workflow: `run-vcpkg` fetches `vcpkg.exe` from the
      # release CDN during bootstrap, so the tool is built from its source
      # archive here instead. Same binary, no dependency on that host.
      - name: Set up vcpkg
        env:
          VCPKG_ROOT: C:/vcpkg
          VCPKG_COMMIT_ID: ${{ env.VCPKG_COMMIT_ID }}
        run: bash tools/setup-vcpkg.sh

      # vcpkg's own binary cache ("x-gha") is unreliable on the current GitHub
      # cache backend, so every run rebuilt ffmpeg/aom/libyuv from source - 16
      # minutes on Windows and ~9 minutes per Android ABI. Caching the installed
      # tree instead makes `vcpkg install` a no-op when nothing changed: it reads
      # `installed/vcpkg/status`, sees the same triplet at the same commit and
      # returns immediately.
      #
      # The key is pinned to the vcpkg commit and the manifest hash, so a change
      # to either invalidates the cache rather than mixing ABI-incompatible
      # packages into a build.
      - name: Cache the vcpkg install tree
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: C:/vcpkg/installed
          key: vcpkg-${{ runner.os }}-x64-windows-static-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-static-${{ env.VCPKG_COMMIT_ID }}-

      # aom's portfile calls vcpkg_find_acquire_program(PERL), and vcpkg pins
      # Strawberry Perl 5.42.2.1 - which it fetches from the same release CDN
      # that is answering 504. The lookup order in vcpkg_find_acquire_program
      # is: `$DOWNLOADS/tools/perl/<version>/perl/bin` (no version check), then
      # PATH (version-checked, and the image ships 5.32.1 which is too old),
      # then the download. Mirroring the image's Perl into the first location
      # therefore satisfies vcpkg without any network access at all.
      # `vcpkg install` resumes from `downloads/`, so anything a failed run
      # managed to fetch is not fetched again. Without this, every retry starts
      # from zero and one flaky URL is enough to fail the whole job forever.
      - name: Cache the vcpkg downloads
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: C:/vcpkg/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-${{ env.VCPKG_COMMIT_ID }}-

      - name: Provide a Perl for aom
        shell: bash
        run: |
          dest="$VCPKG_ROOT/downloads/tools/perl/5.42.2.1"
          if [ -x "$dest/perl/bin/perl.exe" ]; then
            echo "already provided"
            exit 0
          fi
          src=""
          if command -v perl >/dev/null 2>&1; then
            # <root>/perl/bin/perl.exe -> <root>
            src="$(dirname "$(dirname "$(dirname "$(command -v perl)")")")"
          elif [ -d /c/Strawberry ]; then
            src=/c/Strawberry
          fi
          if [ -z "$src" ] || [ ! -x "$src/perl/bin/perl.exe" ]; then
            echo "::warning::no system Perl found - vcpkg will try to download one"
            exit 0
          fi
          mkdir -p "$dest"
          # `perl` finds its lib relative to the executable and its DLLs under
          # `c/bin`, so both trees have to come along.
          cp -r "$src/perl" "$dest/"
          [ -d "$src/c" ] && cp -r "$src/c" "$dest/" || true
          echo "::warning::aom will use the runner's Perl from $src"
          "$dest/perl/bin/perl.exe" -v | head -2

      # vcpkg's NinjaProvider searches PATH for `ninja` and accepts anything
      # >= 1.12.1; the runner image ships 1.13.2 but does not put it on PATH,
      # so vcpkg fell through to downloading ninja-win.zip from the release
      # CDN. Pointing PATH at the copy that is already on disk removes another
      # download from the critical path.
      # vcpkg resolves tools through its own cache *before* PATH:
      #   downloads/tools/ninja-<version>-windows/ninja.exe
      # Putting the runner's binary there is checked first and needs no
      # version discovery. PATH lookup alone was not enough - the Chocolatey
      # copy on PATH was not accepted and vcpkg still reported "A suitable
      # version of ninja was not found (required v1.13.2)" and went on to
      # download, which the broken release CDN refused.
      - name: Provide Ninja for vcpkg
        shell: bash
        run: |
          dest="$VCPKG_ROOT/downloads/tools/ninja-1.13.2-windows"
          if [ -x "$dest/ninja.exe" ]; then
            echo "already staged"
            exit 0
          fi
          found=""
          for candidate in \
            "/c/ProgramData/chocolatey/lib/ninja/tools/ninja.exe" \
            "/c/Program Files/Microsoft Visual Studio/2022/Enterprise/Common7/IDE/CommonExtensions/Microsoft/CMake/Ninja/ninja.exe" \
            "/c/Program Files/Microsoft Visual Studio/2022/Community/Common7/IDE/CommonExtensions/Microsoft/CMake/Ninja/ninja.exe" \
            "/c/Program Files/Microsoft Visual Studio/2022/Professional/Common7/IDE/CommonExtensions/Microsoft/CMake/Ninja/ninja.exe"; do
            if [ -x "$candidate" ]; then found="$candidate"; break; fi
          done
          if [ -z "$found" ] && command -v ninja >/dev/null 2>&1; then
            found="$(command -v ninja)"
          fi
          if [ -z "$found" ]; then
            echo "::warning::no ninja on the runner - vcpkg will try to download one"
            exit 0
          fi
          mkdir -p "$dest"
          cp "$found" "$dest/ninja.exe"
          echo "::warning::ninja $("$dest/ninja.exe" --version) staged at $dest"
          # Keep PATH as well, for any tool that looks it up by name.
          cygpath -w "$(dirname "$found")" >> "$GITHUB_PATH"

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          # vcpkg downloads CMake, ninja and the port sources on first use, and
          # any of those can hit a transient 5xx from the GitHub CDN. Retrying
          # the whole install is safe: it resumes from `downloads/` and skips
          # whatever already succeeded.
          for attempt in 1 2 3; do
            if "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static \
                 --x-install-root="$VCPKG_ROOT/installed"; then
              exit 0
            fi
            echo "::warning::vcpkg install failed (attempt ${attempt}/3), retrying in 30s"
            sleep 30
          done
          find "$VCPKG_ROOT" -name "*.log" | while read -r f; do
            echo "=== $f ==="; cat "$f"; echo
          done
          exit 1

      - name: Report baked-in server
        shell: bash
        run: |
          # The two values below are compiled into the exe via `option_env!`.
          # If they are empty the client silently falls back to RustDesk's
          # public infrastructure, which is exactly what a self-hosted build
          # must not do - so say so loudly in the log.
          if [ -z "${NEXDESK_SERVER:-}" ]; then
            echo "::warning::NEXDESK_SERVER is empty - this build will use RustDesk's public servers. Set the repository variable NEXDESK_SERVER to bake in your own."
          else
            echo "rendezvous server: $NEXDESK_SERVER"
          fi
          if [ -z "${NEXDESK_SERVER_KEY:-}" ]; then
            echo "::warning::NEXDESK_SERVER_KEY is empty - the server's signatures cannot be verified. Set it to the base64 contents of data/id_ed25519.pub on the server."
          else
            echo "server public key: ${#NEXDESK_SERVER_KEY} characters"
          fi

      - name: Verify the update signing key
        shell: bash
        run: |
          # A release without a baked key can never update itself: the client
          # deliberately refuses to run an unsigned update path. Fail here
          # instead of shipping a build that is stuck forever.
          if [[ "${GITHUB_REF}" == refs/tags/* && -z "${NEXDESK_UPDATE_PUBKEY:-}" ]]; then
            echo "::error::NEXDESK_UPDATE_PUBKEY is empty - a tagged release must bake in the update public key"
            exit 1
          fi
          if [[ -z "${NEXDESK_UPDATE_PUBKEY:-}" ]]; then
            echo "::warning::NEXDESK_UPDATE_PUBKEY is empty - this build has auto-update disabled"
          fi

      - name: Build NexDesk
        shell: pwsh
        run: |
          python .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          if (-not (Test-Path ".\flutter\build\windows\x64\runner\Release\NexDesk.exe")) {
            Write-Error "NexDesk.exe was not produced - branding or CMake config is broken"
            exit 1
          }
          mv .\flutter\build\windows\x64\runner\Release .\NexDesk

      # Optional runtime helpers. Missing ones degrade gracefully rather than
      # failing the build, since they are not needed for the install flow.
      - name: Fetch optional runtime resources
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse -ErrorAction SilentlyContinue
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe","usbmmidd_v2\deviceinstaller.exe","usbmmidd_v2\usbmmidd.bat" -ErrorAction SilentlyContinue
          mv -Force .\usbmmidd_v2 .\NexDesk

      # --- Signing stage 1: the binaries that end up inside data.bin --------
      #
      # The packer brotli-compresses this whole folder into data.bin, and
      # SignPath cannot traverse that container, so the inner binaries must be
      # signed *before* packing. Signing only the outer stub would leave
      # NexDesk.exe and librustdesk.dll unsigned, and Windows evaluates exactly
      # those when the packer extracts them and launches the app - which is the
      # moment users were seeing the warning.
      #
      # flutter_windows.dll is deliberately excluded: it is RustDesk's patched
      # Flutter engine under a BSD licence, not our artifact, and signing it
      # would assert something untrue about who built it.
      - name: Stage the payload binaries
        if: env.SIGN_ENABLED == 'true'
        shell: bash
        run: |
          mkdir -p signing/inner
          cp ./NexDesk/NexDesk.exe \
             ./NexDesk/librustdesk.dll \
             ./NexDesk/dylib_virtual_display.dll \
             signing/inner/
          ls -l signing/inner

      - name: Upload the payload binaries
        if: env.SIGN_ENABLED == 'true'
        id: upload-inner
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexdesk-unsigned-inner
          path: signing/inner
          if-no-files-found: error

      - name: Sign the payload binaries
        # Pinned to v3 rather than a commit SHA: confirm the current release SHA
        # before the first signed build and pin it, to match the other actions
        # in this file.
        if: env.SIGN_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORG_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: nexdesk-inner
          github-artifact-id: ${{ steps.upload-inner.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-inner

      - name: Apply and verify the signed payload binaries
        if: env.SIGN_ENABLED == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -Path ./signed-inner/* -Destination ./NexDesk -Recurse -Force

          $kit = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory |
                 Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
                 Sort-Object { [version]$_.Name } -Descending |
                 Select-Object -First 1
          if (-not $kit) { throw 'no Windows SDK bin directory found - signtool is unavailable' }
          $signtool = Join-Path $kit.FullName 'x64\signtool.exe'

          foreach ($f in 'NexDesk.exe', 'librustdesk.dll', 'dylib_virtual_display.dll') {
            $path = "./NexDesk/$f"
            & $signtool verify /pa /v $path
            if ($LASTEXITCODE -ne 0) { throw "$f failed signtool verify" }

            $sig = Get-AuthenticodeSignature $path
            if ($sig.Status -ne 'Valid') { throw "$f signature status is $($sig.Status), expected Valid" }
            if ($sig.TimeStamperCertificate -eq $null) { throw "$f has no timestamp - the signature would expire with the certificate" }
            if ($sig.SignerCertificate.Subject -notmatch 'SignPath Foundation') {
              Write-Warning "$f is signed by '$($sig.SignerCertificate.Subject)', not SignPath Foundation"
            }
            Write-Host "$f -> Valid, timestamped"
          }

      # The MSI's CustomActions are native C++, and WiX v4 resolves through the
      # .NET SDK, so MSBuild has to be on PATH. The default x86 MSBuild host is
      # what upstream uses for the x64 MSI: the target platform comes from
      # -p:Platform, not from the host architecture.
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      # The installer. This is the artifact the signing policy treats as
      # primary: a plain MSI is what Windows expects for an installed
      # application, and it avoids the self-extracting-stub shape that
      # heuristic scanners score highest.
      #
      # continue-on-error is deliberate and temporary. This WiX project has
      # never been built by this workflow before, and a first-run failure in the
      # restore or the CustomActions C++ build should not stop the portable exe
      # from shipping. Remove it once a run is green.
      - name: Build the MSI
        id: msi
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pushd ./res/msi
          python preprocess.py --arp -d ../../NexDesk --version $env:VERSION --revision-version 0
          if ($LASTEXITCODE -ne 0) { throw 'preprocess.py failed' }
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          if ($LASTEXITCODE -ne 0) { throw 'msbuild failed' }
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          if (-not $msi) { throw 'Package.msi was not produced' }
          popd
          New-Item -ItemType Directory -Force ./dist | Out-Null
          Copy-Item $msi.FullName "./dist/NexDesk-$env:VERSION-x64.msi"
          # preprocess.py rewrites res/msi in place (component GUIDs, defines).
          # Restore it so the packer and any later step see the committed tree.
          git checkout -- res/msi
          Get-Item "./dist/NexDesk-$env:VERSION-x64.msi" | Format-List Name, Length

      - name: Report a missing MSI
        if: steps.msi.outcome == 'failure'
        shell: bash
        run: echo "::warning::the MSI build failed - this run ships the portable exe only"

      - name: Pack single-file portable exe
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip install -r requirements.txt
          python ./generate.py -f ../../NexDesk -o . -e ../../NexDesk/NexDesk.exe
          popd
          mkdir -p dist
          cp ./target/release/rustdesk-portable-packer.exe "./dist/${ARTIFACT_NAME}"
          ls -lh "./dist/${ARTIFACT_NAME}"

      # --- Signing stage 2: the files users actually download ----------------
      #
      # By this point the payload inside the portable exe is already signed, so
      # signing the stub and the MSI completes the chain. A signed release must
      # carry both artifacts: shipping a signed exe next to an unsigned MSI
      # would invite users to pick the unsigned one.
      - name: Stage the release artifacts
        if: env.SIGN_ENABLED == 'true'
        shell: bash
        run: |
          mkdir -p signing/outer
          cp "dist/${ARTIFACT_NAME}" signing/outer/
          if [ ! -f "dist/NexDesk-${VERSION}-x64.msi" ]; then
            echo "::error::the MSI is missing - a signed release must contain both artifacts"
            exit 1
          fi
          cp "dist/NexDesk-${VERSION}-x64.msi" signing/outer/
          ls -l signing/outer

      - name: Upload the release artifacts
        if: env.SIGN_ENABLED == 'true'
        id: upload-outer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexdesk-unsigned-outer
          path: signing/outer
          if-no-files-found: error

      - name: Sign the release artifacts
        if: env.SIGN_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORG_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: nexdesk-outer
          github-artifact-id: ${{ steps.upload-outer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-outer

      - name: Apply and verify the signed release artifacts
        if: env.SIGN_ENABLED == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -Path ./signed-outer/* -Destination ./dist -Recurse -Force

          $kit = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory |
                 Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
                 Sort-Object { [version]$_.Name } -Descending |
                 Select-Object -First 1
          if (-not $kit) { throw 'no Windows SDK bin directory found - signtool is unavailable' }
          $signtool = Join-Path $kit.FullName 'x64\signtool.exe'

          foreach ($f in $env:ARTIFACT_NAME, "NexDesk-$env:VERSION-x64.msi") {
            $path = "./dist/$f"
            & $signtool verify /pa /all /v $path
            if ($LASTEXITCODE -ne 0) { throw "$f failed signtool verify" }

            $sig = Get-AuthenticodeSignature $path
            if ($sig.Status -ne 'Valid') { throw "$f signature status is $($sig.Status), expected Valid" }
            if ($sig.TimeStamperCertificate -eq $null) { throw "$f has no timestamp - the signature would expire with the certificate" }
            Write-Host "$f -> Valid, timestamped"
          }

          # Checksums must describe the signed bytes, not the pre-signing ones.
          # The updater compares the downloaded file against the hash published
          # by api/update.php, so a stale hash would fail every client update.
          Get-ChildItem ./dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii ./dist/SHA256SUMS.txt
          Get-Content ./dist/SHA256SUMS.txt

      # Cheap guard against publishing a file that would be quarantined on
      # arrival. -DisableRemediation matters: without it Defender may delete the
      # artifact mid-scan, and the run would then fail for the wrong reason.
      #
      # A detection is fatal only for a signed release. While SIGN_ENABLED is
      # unset the build is not publishable anyway, and a known false positive
      # should not block development.
      - name: Scan the artifacts with Defender
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { Write-Warning 'MpCmdRun.exe not found - skipping the scan'; exit 0 }
          $bad = @()
          Get-ChildItem ./dist -File |
            Where-Object { $_.Extension -in '.exe', '.msi' } |
            ForEach-Object {
              & $mp -Scan -ScanType 3 -File $_.FullName -DisableRemediation
              if ($LASTEXITCODE -ne 0) {
                $bad += $_.Name
                Write-Warning "Defender flagged $($_.Name) (exit $LASTEXITCODE)"
              } else {
                Write-Host "$($_.Name): clean"
              }
            }
          if ($bad.Count -gt 0) {
            $list = $bad -join ', '
            if ($env:SIGN_ENABLED -eq 'true') {
              Write-Error "Defender flagged $list - submit a false positive (docs/false-positives.md) before releasing"
              exit 1
            }
            Write-Warning "Defender flagged $list - not fatal because SIGN_ENABLED is unset"
          }

      - name: Warn about an unsigned build
        if: env.SIGN_ENABLED != 'true'
        shell: bash
        run: |
          echo "::warning::shipping an UNSIGNED build - set the SIGN_ENABLED repository variable to sign. Do not publish this as a release."

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NexDesk-windows-x64
          path: |
            dist/${{ env.ARTIFACT_NAME }}
            dist/*.msi
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach to release
        if: ${{ inputs.make_release || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: |
            dist/${{ env.ARTIFACT_NAME }}
            dist/*.msi
            dist/SHA256SUMS.txt
          name: NexDesk ${{ env.VERSION }}
          draft: true
