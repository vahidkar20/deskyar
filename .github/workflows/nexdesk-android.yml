name: Build NexDesk (Android)

# Android-only build, independent of the upstream multi-platform matrix.
#
# `flutter-build.yml` is the upstream pipeline: a tag builds Windows, macOS,
# iOS, three Linux flavours, Flatpak, AppImage and Android together, and most of
# those jobs need signing material this repository does not have. This workflow
# exists so "build the APK" is one button that finishes in about an hour and
# cannot fail because of a macOS certificate.
#
# The native library is built per ABI in parallel, then one universal APK is
# assembled from the three .so files - the same artefact layout the upstream
# universal job produces.
#
# The rendezvous server is baked into the .so at compile time
# (src/nexdesk_server.rs reads NEXDESK_SERVER with `option_env!`). Both sides of
# a connection - this APK and the Windows exe - must carry the same server and
# the same public key, which is why both workflows read the same repository
# variables.

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: "Attach the APK to a GitHub Release (tag refs only)"
        type: boolean
        default: false
  # Deliberately not triggered by tag pushes: the release is created by
  # `publish-release.yml` from artifacts that already exist, and a `push: tags`
  # trigger would start a second, pointless rebuild of both platforms.

permissions:
  contents: write

concurrency:
  group: nexdesk-android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r28c"
  CARGO_NDK_VERSION: "3.1.2"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # Repository variables, not secrets: the host and its Ed25519 public key are
  # handed to every client by design. An empty value silently points the build
  # at RustDesk's public infrastructure, which cannot be reached from Iran.
  NEXDESK_SERVER: ${{ vars.NEXDESK_SERVER || vars.DESKYAR_SERVER }}
  NEXDESK_SERVER_KEY: ${{ vars.NEXDESK_SERVER_KEY || vars.DESKYAR_SERVER_KEY }}
  # Release keystore, optional. Without it the APK is debug-signed (installable,
  # fine for testing) - but Cafe Bazaar needs a release signature, so add the
  # four secrets before publishing there. The `if:` below checks for an empty
  # string, not null: an unset secret reaches env as "".
  ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
  ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS }}
  ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  bridge:
    uses: ./.github/workflows/bridge.yml

  lib:
    needs: [bridge]
    name: native ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
            script: ./flutter/ndk_arm64.sh
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
            script: ./flutter/ndk_arm.sh
          - target: x86_64-linux-android
            abi: x86_64
            script: ./flutter/ndk_x64.sh
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang \
               cmake \
               curl \
               gcc-multilib \
               git \
               g++ \
               g++-multilib \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libc6-dev \
               libclang-dev \
               libunwind-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-dev \
               nasm \
               ninja-build \
               openjdk-17-jdk-headless \
               pkg-config \
               tree \
               wget

      - name: Checkout source code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          submodules: recursive

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      # `lukka/run-vcpkg` bootstraps by downloading a prebuilt `vcpkg-glibc`
      # from the release CDN, which is exactly the host that was returning 504.
      # The helper builds the same tool from its source archive instead and
      # exports VCPKG_ROOT for the steps below.
      - name: Set up vcpkg
        env:
          VCPKG_ROOT: /opt/artifacts/vcpkg
          VCPKG_COMMIT_ID: ${{ env.VCPKG_COMMIT_ID }}
        run: bash tools/setup-vcpkg.sh

      # See the Windows workflow: vcpkg's x-gha binary cache no longer hits, so
      # the installed tree is cached directly. Each ABI has its own triplet and
      # therefore its own cache entry.
      - name: Cache the vcpkg install tree
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: /opt/artifacts/vcpkg/installed
          key: vcpkg-${{ runner.os }}-${{ matrix.abi }}-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.abi }}-${{ env.VCPKG_COMMIT_ID }}-

      # vcpkg downloads a CMake 4.4 toolchain from the GitHub release CDN on
      # first use. PyPI serves the same binary from a different host, so
      # installing it first means vcpkg finds a suitable `cmake` on PATH and
      # skips that download - which is what failed with 504 and killed the
      # x86_64 job.
      - name: Install CMake from PyPI
        run: |
          python3 -m pip install --user --break-system-packages cmake \
            || python3 -m pip install --user cmake
          # `export` only lives for this step; vcpkg runs in the next one, so
          # the directory has to go into GITHUB_PATH.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          cmake --version

      - name: Install vcpkg dependencies
        run: |
          # The matrix carries the ABI folder directly, so no case statement is
          # needed to translate a Rust target into an Android ABI.
          ANDROID_TARGET=${{ matrix.abi }}
          # vcpkg pulls CMake and the port sources from the GitHub CDN on first
          # use; a 504 there aborted the whole ABI. Retrying resumes from the
          # `downloads` cache and skips ports that already built.
          for attempt in 1 2 3; do
            if ./flutter/build_android_deps.sh "${ANDROID_TARGET}"; then
              exit 0
            fi
            echo "::warning::vcpkg install failed (attempt ${attempt}/3), retrying in 30s"
            sleep 30
          done
          find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
            echo "$_1:"
            echo "======"
            cat "$_1"
            echo "======"
            echo ""
          done
          exit 1
        shell: bash

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-android # TODO: drop '-android' part after caches are invalidated
          key: ${{ matrix.target }}

      - name: Build librustdesk.so
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          if [ -z "${NEXDESK_SERVER:-}" ]; then
            echo "::warning::NEXDESK_SERVER is empty - this APK will point at RustDesk's public servers and will not reach the self-hosted one. Set the repository variable NEXDESK_SERVER."
          else
            echo "rendezvous server: $NEXDESK_SERVER"
          fi
          if [ -z "${NEXDESK_SERVER_KEY:-}" ]; then
            echo "::warning::NEXDESK_SERVER_KEY is empty - the server's signatures cannot be verified."
          else
            echo "server public key: ${#NEXDESK_SERVER_KEY} characters"
          fi
          rustup target add ${{ matrix.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ${{ matrix.script }}

      - name: Upload the native library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: librustdesk.so.${{ matrix.target }}
          path: ./target/${{ matrix.target }}/release/liblibrustdesk.so
          if-no-files-found: error

  apk:
    needs: [lib]
    name: universal APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang \
               cmake \
               curl \
               gcc-multilib \
               git \
               g++ \
               g++-multilib \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libc6-dev \
               libclang-dev \
               libunwind-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-dev \
               nasm \
               ninja-build \
               openjdk-17-jdk-headless \
               pkg-config \
               tree \
               wget

      - name: Checkout source code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Download arm64 library
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: librustdesk.so.aarch64-linux-android
          path: ./flutter/android/app/src/main/jniLibs/arm64-v8a

      - name: Download armv7 library
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: librustdesk.so.armv7-linux-androideabi
          path: ./flutter/android/app/src/main/jniLibs/armeabi-v7a

      - name: Download x86_64 library
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: librustdesk.so.x86_64-linux-android
          path: ./flutter/android/app/src/main/jniLibs/x86_64

      - name: Build the universal APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          set -euo pipefail
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Gradle needs more heap than the 1g default for a release build.
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # The APK is signed again below when a keystore secret exists; until
          # then the debug config keeps `flutter build` working.
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv "./flutter/android/app/src/main/jniLibs/$abi/liblibrustdesk.so" \
               "./flutter/android/app/src/main/jniLibs/$abi/librustdesk.so"
          done
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" ./flutter/android/app/src/main/jniLibs/arm64-v8a/
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so" ./flutter/android/app/src/main/jniLibs/armeabi-v7a/
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so" ./flutter/android/app/src/main/jniLibs/x86_64/
          pushd flutter
          flutter build apk --release --target-platform android-arm64,android-arm,android-x64
          popd
          mkdir -p signed-apk
          mv ./flutter/build/app/outputs/flutter-apk/app-release.apk \
             "signed-apk/NexDesk-${VERSION}-android-universal.apk"
          ls -lh signed-apk

      - name: Setup sign tool version variable
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "ANDROID_SIGN_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo Last build tool version is: $BUILD_TOOL_VERSION

      - uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        name: Sign app APK
        if: env.ANDROID_SIGNING_KEY != ''
        id: sign-apk
        with:
          releaseDirectory: ./signed-apk
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          # env.ANDROID_SIGN_TOOL_VERSION is set by Step "Setup sign tool version variable"
          BUILD_TOOLS_VERSION: ${{ env.ANDROID_SIGN_TOOL_VERSION }}

      - name: Upload the APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NexDesk-android-universal
          path: ${{ steps.sign-apk.outputs.signedReleaseFile || format('signed-apk/NexDesk-{0}-android-universal.apk', env.VERSION) }}
          if-no-files-found: error

      - name: Attach to release
        if: ${{ inputs.make_release || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          # The signing action renames its output to `<name>-signed.apk`, so the
          # path has to come from its output whenever it ran.
          files: ${{ steps.sign-apk.outputs.signedReleaseFile || format('signed-apk/NexDesk-{0}-android-universal.apk', env.VERSION) }}
          name: NexDesk ${{ env.VERSION }}
          draft: true
