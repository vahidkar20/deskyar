name: Sync upstream RustDesk

# Pulls new RustDesk releases in without losing the NexDesk customisations.
#
# The repository carries two branches on purpose:
#
#   upstream  a verbatim copy of rustdesk/rustdesk at each release, one commit
#             per version. It holds no NexDesk code at all.
#   main      that same history plus a single "NexDesk" commit on top: branding,
#             the in-app installer, and the update feed.
#
# Because `upstream` is a real ancestor of `main`, a new release is merged with
# git's three-way merge. Upstream's code flows in file by file, and anything we
# changed is preserved unless upstream touched the exact same lines - in which
# case the merge stops with a conflict instead of silently reverting branding.
#
# Flow: detect -> rebuild the `upstream` branch -> merge into main -> bump
# version -> tag -> dispatch the Windows build.

on:
  schedule:
    # 03:17 UTC daily. Upstream publishes mid-week, so a day of lag is the
    # worst case before a rebuild starts.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream tag to sync (blank = newest release)"
        required: false
        default: ""
      auto_publish:
        description: "Commit, tag and build without review"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: nexdesk-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Resolve upstream release
        id: upstream
        run: |
          set -euo pipefail
          TAG="${{ inputs.upstream_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(curl -sSL -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/rustdesk/rustdesk/releases/latest | jq -r '.tag_name // empty')
          fi
          if [ -z "$TAG" ]; then
            echo "::error::could not resolve the upstream release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "upstream release: $TAG"

      - name: Compare with current version
        id: compare
        run: |
          set -euo pipefail
          CURRENT=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          NEWEST=$(printf '%s\n%s\n' "$CURRENT" "${{ steps.upstream.outputs.version }}" | sort -V | tail -1)
          if [ "$NEWEST" = "$CURRENT" ]; then
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
            echo "already on $CURRENT, nothing to do"
          else
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
            echo "will merge ${{ steps.upstream.outputs.version }} into $CURRENT"
          fi

      - name: Build the upstream branch
        id: upstream_branch
        if: steps.compare.outputs.needs_sync == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          TAG="${{ steps.upstream.outputs.tag }}"

          git config user.name "NexDesk Sync"
          git config user.email "sync@nexdesk.local"
          git checkout upstream

          echo "::group::fetch upstream source"
          curl -sSL "https://github.com/rustdesk/rustdesk/archive/refs/tags/${TAG}.tar.gz" -o /tmp/upstream.tgz
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/upstream.tgz -C . --strip-components=1
          echo "::endgroup::"

          echo "::group::expand hbb_common"
          # The source tarball omits submodule content, and this branch has to be
          # a self-contained snapshot so the merge can diff it file by file.
          HBB_SHA=$(curl -sSL -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/rustdesk/rustdesk/contents/libs/hbb_common?ref=${TAG}" | jq -r '.sha')
          if [ -z "$HBB_SHA" ] || [ "$HBB_SHA" = "null" ]; then
            echo "::error::could not resolve the hbb_common revision for $TAG"
            exit 1
          fi
          git clone --quiet https://github.com/rustdesk/hbb_common /tmp/hbb
          git -C /tmp/hbb checkout --quiet "$HBB_SHA"
          rm -rf /tmp/hbb/.git
          rm -rf libs/hbb_common
          cp -r /tmp/hbb libs/hbb_common
          echo "hbb_common @ $HBB_SHA"
          echo "::endgroup::"

          git add -A -f
          git commit -m "upstream RustDesk ${TAG}"
          echo "upstream branch now at ${TAG}"

      - name: Merge into main
        id: merge
        if: |
          steps.compare.outputs.needs_sync == 'true' &&
          steps.upstream_branch.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          TAG="${{ steps.upstream.outputs.tag }}"

          git checkout main
          if ! git merge --no-commit --no-ff upstream; then
            echo "conflicts=$(git diff --name-only --diff-filter=U | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            git merge --abort
            echo "::error::merge conflicts with ${TAG}"
            exit 1
          fi

          # Keep both version files in step; a no-op when upstream already
          # carries the new number.
          python3 scripts/bump-version.py "${{ steps.upstream.outputs.version }}" --root .

          # Belt and braces: the merge should already preserve branding, but a
          # silent revert here would ship a build that calls itself RustDesk.
          python3 scripts/apply-branding.py --root . --check
          test -f src/nexdesk.rs
          test -f flutter/lib/desktop/widgets/install_banner.dart
          grep -q 'mod nexdesk;' src/lib.rs
          grep -q 'NexDesk' libs/hbb_common/src/config.rs
          grep -q 'NexDeskInstallBanner' flutter/lib/desktop/pages/connection_page.dart

          git add -A
          git commit -m "chore: sync upstream RustDesk ${TAG}

          Merged the ${TAG} snapshot from the upstream branch. Branding, the
          in-app installer and the update feed are unchanged."

      - name: Push and tag
        if: |
          steps.compare.outputs.needs_sync == 'true' &&
          steps.merge.outcome == 'success' &&
          (inputs.auto_publish || github.event_name == 'schedule')
        run: |
          set -euo pipefail
          VERSION="${{ steps.upstream.outputs.version }}"
          git tag "v${VERSION}"
          git push origin upstream
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v${VERSION}"
          echo "pushed v${VERSION}"

      # A tag pushed with GITHUB_TOKEN does not raise a `push` event, so the
      # build is dispatched explicitly. Swap in a PAT if you would rather rely
      # on the tag trigger.
      - name: Trigger the build
        if: |
          steps.compare.outputs.needs_sync == 'true' &&
          steps.merge.outcome == 'success' &&
          (inputs.auto_publish || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run nexdesk-windows.yml \
            --ref "v${{ steps.upstream.outputs.version }}" \
            -f make_release=true
          echo "dispatched the Windows build"

      - name: Open a pull request instead
        if: |
          steps.compare.outputs.needs_sync == 'true' &&
          steps.merge.outcome == 'success' &&
          inputs.auto_publish == false &&
          github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="nexdesk-sync/upstream-${{ steps.upstream.outputs.version }}"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          gh pr create \
            --title "Sync upstream RustDesk ${{ steps.upstream.outputs.tag }}" \
            --body "Merged \`${{ steps.upstream.outputs.tag }}\` from the \`upstream\` branch.

          The merge was clean and the branding checks passed. Merge this, then push
          the tag \`v${{ steps.upstream.outputs.version }}\` to build and publish." \
            --base "${GITHUB_REF_NAME}" --head "$BRANCH"

      - name: Report a failed sync
        if: |
          steps.compare.outputs.needs_sync == 'true' &&
          (steps.upstream_branch.outcome != 'success' || steps.merge.outcome != 'success')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue create \
            --title "Upstream ${{ steps.upstream.outputs.tag }} needs a manual merge" \
            --body "The automated sync onto \`${{ steps.upstream.outputs.tag }}\` stopped.

          Upstream changed the same lines NexDesk changes, so git refused to merge
          rather than silently dropping the branding. Nothing was pushed.

          **Resolve locally**

          \`\`\`bash
          git fetch origin && git checkout main
          git merge origin/upstream          # resolve the reported conflicts
          python3 scripts/apply-branding.py --root .   # re-assert branding if needed
          python3 scripts/bump-version.py ${{ steps.upstream.outputs.version }} --root .
          git commit && git push
          git tag v${{ steps.upstream.outputs.version }} && git push origin v${{ steps.upstream.outputs.version }}
          \`\`\`

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label upstream-sync
