name: Build DeskYar (Windows x64)

# Produces the single-file portable exe:
#   DeskYar-1.5.0-x64.exe
#
# Running it extracts the payload to %LOCALAPPDATA%\deskyar and starts the app
# in portable mode. The home page then shows the "Install DeskYar" button,
# which promotes the run into a real installation under Program Files.
#
# Trigger: Actions -> "Build DeskYar (Windows x64)" -> Run workflow,
# or push a tag like v1.5.0.

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: "Attach the exe to a GitHub Release"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

# One build at a time. A Windows run costs ~120 billed minutes (the runner has
# a 2x multiplier), so leaving two queued runs to finish after a second push
# doubles the bill for an artifact nobody will download.
#
# `cancel-in-progress` only cancels runs that have not started yet and are
# superseded by a newer commit on the same ref. A release tag is deliberately
# excluded: cancelling a tagged build would leave a half-published release.
concurrency:
  group: deskyar-windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # VERSION and ARTIFACT_NAME are derived from Cargo.toml in the first step, so
  # the upstream-sync job can bump the version and have this workflow pick it up
  # without editing YAML.
  # Pinned to the versions upstream 1.5.0 is known to build with. The Flutter
  # engine is patched by RustDesk, so the SDK version cannot be bumped freely.
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_CMAKE_VERSION: "4.3.0"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # Baked into the binary via `option_env!` in src/deskyar.rs so installed
  # clients poll this repository for updates.
  DESKYAR_UPDATE_REPO: ${{ github.repository }}
  # Self-hosted rendezvous (hbbs) server, baked into the binary via
  # `option_env!` in src/deskyar_server.rs.
  #
  # Set these as GitHub Actions *variables* (Settings -> Secrets and
  # variables -> Actions -> Variables), not secrets - they are not confidential:
  #   DESKYAR_SERVER      = "rd.your-domain.com"
  #   DESKYAR_SERVER_KEY  = "base64 of data/id_ed25519.pub from the server"
  #
  # When DESKYAR_SERVER is empty the build falls back to upstream's public
  # infrastructure, which is what you do not want for an Iranian audience.
  DESKYAR_SERVER: ${{ vars.DESKYAR_SERVER }}
  DESKYAR_SERVER_KEY: ${{ vars.DESKYAR_SERVER_KEY }}

jobs:
  # The Dart <-> Rust bridge is generated, not committed, so it has to be
  # produced first and shared with the build job.
  bridge:
    uses: ./.github/workflows/bridge.yml

  windows:
    name: Windows x64
    needs: [bridge]
    runs-on: windows-2022
    timeout-minutes: 150

    steps:
      - name: Export cache environment for vcpkg
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          submodules: recursive

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::could not read the version from Cargo.toml"
            exit 1
          fi
          # Asset name must match `deskyar::asset_name()` and the URL the
          # updater builds: <product>-<version>-<arch>.exe
          ARTIFACT_NAME="DeskYar-${VERSION}-x86_64.exe"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
          echo "building $ARTIFACT_NAME"

      - name: Check Cargo.lock matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          # `cargo build --locked` refuses to run when Cargo.lock disagrees with
          # the manifests, and it refuses *after* the Flutter engine download and
          # the vcpkg install - roughly forty minutes in, with a message that
          # points at the lock file rather than at the version bump that caused
          # it. Bumping the version in Cargo.toml without updating Cargo.lock is
          # the usual reason, so check that pair here, in two seconds.
          manifest=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          locked=$(grep -A2 '^name = "rustdesk"$' Cargo.lock \
                   | grep -m1 '^version = ' \
                   | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$locked" ]; then
            echo "::error::no [[package]] name = \"rustdesk\" entry in Cargo.lock"
            exit 1
          fi
          if [ "$manifest" != "$locked" ]; then
            echo "::error::Cargo.toml says $manifest but Cargo.lock says $locked."
            echo "Fix: change the version line of the 'rustdesk' package in Cargo.lock to $manifest,"
            echo "or run 'cargo generate-lockfile' locally and commit the result."
            exit 1
          fi
          echo "Cargo.lock is in sync ($manifest)"

      - name: Restore generated bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM / Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # RustDesk ships a patched Flutter engine (text input, multi-window).
      # The stock engine builds but misbehaves at runtime.
      
      - name: Swap in the RustDesk Flutter engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          flutter doctor -v
          flutter precache --windows

          # Detect the actual Flutter SDK installation path.
          $flutterCommand = Get-Command flutter -ErrorAction Stop
          $flutterRoot = Split-Path (Split-Path $flutterCommand.Source -Parent) -Parent
          Write-Host "Flutter root: $flutterRoot"

          # Download the custom RustDesk engine.
          $zipPath = Join-Path $PWD "windows-x64-release.zip"
          $extractPath = Join-Path $PWD "windows-x64-release"

          Invoke-WebRequest `
            -Uri "https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip" `
            -OutFile $zipPath

          if (-not (Test-Path $zipPath)) {
            throw "RustDesk engine ZIP was not downloaded."
          }

          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

          # Locate the engine files regardless of the ZIP's folder structure.
          $engineDll = Get-ChildItem `
            -Path $extractPath `
            -Filter "flutter_windows.dll" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $engineDll) {
            Get-ChildItem $extractPath -Recurse |
              Select-Object FullName |
              Format-Table -AutoSize |
              Out-String |
              Write-Host

            throw "flutter_windows.dll was not found in the downloaded RustDesk engine ZIP."
          }

          $sourcePath = $engineDll.Directory.FullName
          $targetPath = Join-Path $flutterRoot "bin\cache\artifacts\engine\windows-x64-release"

          New-Item -ItemType Directory -Path $targetPath -Force | Out-Null

          Write-Host "Engine source: $sourcePath"
          Write-Host "Engine target: $targetPath"

          Copy-Item `
            -Path (Join-Path $sourcePath "*") `
            -Destination $targetPath `
            -Recurse `
            -Force

          if (-not (Test-Path (Join-Path $targetPath "flutter_windows.dll"))) {
            throw "RustDesk Flutter engine installation failed."
          }

          Write-Host "RustDesk Flutter engine installed successfully."

      - name: Patch Flutter dropdown filter
        shell: bash
        run: |
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_ROOT"
          cd "$FLUTTER_ROOT"
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static \
               --x-install-root="$VCPKG_ROOT/installed"; then
            find "$VCPKG_ROOT" -name "*.log" | while read -r f; do
              echo "=== $f ==="; cat "$f"; echo
            done
            exit 1
          fi

      - name: Report baked-in server
        shell: bash
        run: |
          # The two values below are compiled into the exe via `option_env!`.
          # If they are empty the client silently falls back to RustDesk's
          # public infrastructure, which is exactly what a self-hosted build
          # must not do - so say so loudly in the log.
          if [ -z "${DESKYAR_SERVER:-}" ]; then
            echo "::warning::DESKYAR_SERVER is empty - this build will use RustDesk's public servers. Set the repository variable DESKYAR_SERVER to bake in your own."
          else
            echo "rendezvous server: $DESKYAR_SERVER"
          fi
          if [ -z "${DESKYAR_SERVER_KEY:-}" ]; then
            echo "::warning::DESKYAR_SERVER_KEY is empty - the server's signatures cannot be verified. Set it to the base64 contents of data/id_ed25519.pub on the server."
          else
            echo "server public key: ${#DESKYAR_SERVER_KEY} characters"
          fi

      - name: Build DeskYar
        shell: pwsh
        run: |
          python .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          if (-not (Test-Path ".\flutter\build\windows\x64\runner\Release\DeskYar.exe")) {
            Write-Error "DeskYar.exe was not produced - branding or CMake config is broken"
            exit 1
          }
          mv .\flutter\build\windows\x64\runner\Release .\DeskYar

      # Optional runtime helpers. Missing ones degrade gracefully rather than
      # failing the build, since they are not needed for the install flow.
      - name: Fetch optional runtime resources
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse -ErrorAction SilentlyContinue
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe","usbmmidd_v2\deviceinstaller.exe","usbmmidd_v2\usbmmidd.bat" -ErrorAction SilentlyContinue
          mv -Force .\usbmmidd_v2 .\DeskYar

      - name: Pack single-file portable exe
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip install -r requirements.txt
          python ./generate.py -f ../../DeskYar -o . -e ../../DeskYar/DeskYar.exe
          popd
          mkdir -p dist
          cp ./target/release/rustdesk-portable-packer.exe "./dist/${ARTIFACT_NAME}"
          ls -lh "./dist/${ARTIFACT_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DeskYar-windows-x64
          path: dist/${{ env.ARTIFACT_NAME }}
          if-no-files-found: error

      - name: Attach to release
        if: ${{ inputs.make_release || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: dist/${{ env.ARTIFACT_NAME }}
          name: DeskYar ${{ env.VERSION }}
          draft: true
