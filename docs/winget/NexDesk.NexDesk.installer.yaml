# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
PackageIdentifier: NexDesk.NexDesk
PackageVersion: <version>
# WiX-built MSI: winget derives the silent switches (/qn) from this type.
InstallerType: wix
Scope: machine
InstallModes:
  - interactive
  - silent
  - silentWithProgress
UpgradeBehavior: install
Installers:
  - Architecture: x64
    InstallerUrl: https://nexdesk.ir/updates/NexDesk-<version>-x64.msi
    InstallerSha256: <sha256>
ManifestType: installer
ManifestVersion: 1.6.0
