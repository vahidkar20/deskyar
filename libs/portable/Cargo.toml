[package]
name = "rustdesk-portable-packer"
# This is the version stamped into the single-file exe that users download, so
# it has to track the product version rather than drift on its own. It had
# drifted: the packer reported 1.5.8 while the app inside it reported 1.5.11,
# which reads as a repacked/re-signed binary to scanners and fails code-signing
# metadata review. scripts/bump-version.py now rewrites it.
version = "1.5.11"
edition = "2021"
description = "RustDesk Remote Desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

build = "build.rs"

[dependencies]
brotli = "3.4"
dirs = "5.0"
md5 = "0.7"
winapi = { version = "0.3", features = ["winbase", "libloaderapi"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Wdk",
    "Wdk_System",
    "Wdk_System_SystemServices",
    "Win32",
    "Win32_System",
    "Win32_System_SystemInformation",
] }
native-windows-gui = {version = "1.0", default-features = false, features = ["animation-timer", "image-decoder"]}

[package.metadata.winres]
# This is the executable users actually double-click, so its VersionInfo is the
# one Windows shows in file properties and in the UAC prompt. It still carried
# the upstream name, which made a NexDesk download look like someone else's
# binary.
LegalCopyright = "Copyright © 2026 NexDesk. Based on RustDesk (AGPL-3.0)."
CompanyName = "NexDesk"
ProductName = "NexDesk"
OriginalFilename = "NexDesk.exe"
FileDescription = "NexDesk Remote Desktop"

[target.'cfg(target_os="windows")'.build-dependencies]
winres = "0.1"
winapi = { version = "0.3", features = [ "winnt", "pdh", "synchapi" ] }


